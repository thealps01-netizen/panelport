name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  checks:
    name: Secret scan, path audit, dependency audit, licenses, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks, full history and working tree)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
          /tmp/gitleaks dir . --redact --no-banner

      - name: Portable-paths audit
        run: bash scripts/audit-paths.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install build tooling (locked)
        run: npm ci

      - name: Install Rust release tools (locked)
        run: |
          cargo install --locked cargo-audit@0.23.0
          cargo install --locked cargo-about@0.9.3 --features cli
          cargo install --locked cargo-cyclonedx@0.5.10

      - name: Release check (fails on known vulnerabilities)
        run: bash scripts/release-check.sh

      - name: Third-party licenses for the Windows build
        run: python3 scripts/gen-licenses.py

      - name: CycloneDX SBOM for the Windows build
        run: |
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target x86_64-pc-windows-msvc --override-filename panelport-sbom.cdx
          test -s src-tauri/panelport-sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses-sbom
          path: |
            THIRD_PARTY_LICENSES.txt
            src-tauri/panelport-sbom.cdx.json
          if-no-files-found: error

  build-windows:
    name: Test and build (Windows)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses-sbom
          path: generated

      - name: Use the freshly generated license file
        shell: bash
        run: cp generated/THIRD_PARTY_LICENSES.txt THIRD_PARTY_LICENSES.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install build tooling (locked)
        run: npm ci

      - name: Unit tests, including the IPC security test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the NSIS installer
        run: npx --no-install tauri build --bundles nsis -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  smoke-windows:
    name: Clean-machine smoke test (Windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      # Only the smoke script: the runner has no source tree and no build tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/smoke-windows.ps1
            scripts/smoke-cdp.cs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Install, self-test, launch, screenshot, uninstall
        shell: pwsh
        run: |
          $inst = Get-ChildItem installer -Filter *-setup.exe | Select-Object -First 1
          ./scripts/smoke-windows.ps1 -Installer $inst.FullName -OutDir smoke-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-results
          path: smoke-out
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            INSTALL.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dl/installer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses-sbom
          path: dl/meta

      - name: Collect files and write SHA256SUMS.txt
        run: |
          mkdir out
          cp dl/installer/*-setup.exe out/
          cp dl/meta/src-tauri/panelport-sbom.cdx.json "out/panelport-${GITHUB_REF_NAME}-sbom.cdx.json"
          cp dl/meta/THIRD_PARTY_LICENSES.txt out/
          cp INSTALL.md out/
          cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Artifact attestation (build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/*-setup.exe
            out/*-sbom.cdx.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Panelport $GITHUB_REF_NAME" \
            --notes-file INSTALL.md
