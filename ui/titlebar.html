<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panelport</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body class="bar-page">
  <header class="titlebar" id="bar">
    <span class="mark">Panelport</span>
    <span class="sep"></span>
    <div class="who" id="who"><span class="dot" id="dot"></span><span class="pn" id="name"></span><span class="url" id="url"></span></div>
    <span class="grow"></span>
    <div class="tools">
      <button class="icon-btn" id="reload" data-t-label="reload"></button>
      <button class="pill" id="back" data-t="backToPanels">Back to panels</button>
    </div>
  </header>
  <script src="common.js"></script>
  <script src="titlebar.js"></script>
</body>
</html>
