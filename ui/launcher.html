<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panelport</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="titlebar" id="bar">
      <span class="mark">Panelport</span>
      <span class="sep"></span>
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" id="tab-panels" aria-controls="view-panels" data-view="panels" data-t="panels">Panels</button>
        <button role="tab" id="tab-find" aria-controls="view-find" data-view="find" data-t="find">Find panels</button>
        <button role="tab" id="tab-settings" aria-controls="view-settings" data-view="settings" data-t="settings">Settings</button>
      </nav>
      <span class="grow"></span>
      <div class="tools">
        <span class="dockline" id="dock"><i></i><span></span></span>
        <button class="pill" id="add-panel" data-t="addPanel">Add panel</button>
      </div>
    </header>

    <main class="view panels-view hidden" id="view-panels" role="tabpanel" aria-labelledby="tab-panels">
      <section class="list" aria-label="Panels">
        <div class="list-head lab" id="list-head"></div>
        <div class="list-items scroll" id="list" role="listbox" tabindex="0"></div>
      </section>
      <div class="stage" id="stage" tabindex="0" role="button"></div>
      <nav class="rail" id="rail"></nav>
    </main>

    <main class="view find-view hidden" id="view-find" role="tabpanel" aria-labelledby="tab-find">
      <section class="find-main">
        <h1 class="h" id="find-title"></h1>
        <div class="find-meta" id="find-meta"></div>
        <div class="rows scroll" id="find-rows"></div>
      </section>
      <aside><div class="card" id="find-card"></div></aside>
    </main>

    <main class="view settings-view hidden" id="view-settings" role="tabpanel" aria-labelledby="tab-settings">
      <nav class="subnav" id="subnav"></nav>
      <div class="sections scroll" id="sections"></div>
    </main>
  </div>
  <script src="common.js"></script>
  <script src="launcher.js"></script>
  <script src="settings.js"></script>
</body>
</html>
