<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panelport</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="down-wrap">
    <div class="down-card" id="card">
      <div class="who">
        <div id="avatar"></div>
        <div class="minw0">
          <h2 id="headline"></h2>
          <div class="mono muted small selectable" id="url"></div>
        </div>
      </div>
      <p class="muted" id="intro"></p>
      <div class="steps" id="steps"></div>
      <div id="message" class="muted small hidden" role="status"></div>
      <div id="error" class="error-msg hidden" role="alert"></div>
      <div class="actions-row" id="actions"></div>
      <div class="retry-line"><div class="spinner"></div><span id="retry"></span></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="down.js"></script>
</body>
</html>
